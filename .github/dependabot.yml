version: 2
updates:
  # Gradle — the version catalog (gradle/libs.versions.toml) drives every Kotlin module.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      gradle-minor-patch:
        update-types: ["minor", "patch"]

  # Web app (npm).
  - package-ecosystem: npm
    directory: "/webApp"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint (our linter, latest 8.63.0) peers `typescript <6.1.0`, so the whole lint
      # toolchain can't run against TS 6.1+/7.x yet — adopting them breaks `npm run lint` (ERESOLVE).
      # Revisit when typescript-eslint ships TS 7 support.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  # The GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies"]
    ignore:
      # The workflows reference codeql-action by its floating major tag (`@v4`), which already picks
      # up every patch and minor release. Dependabot reads that as "pin me to 4.x.y" and opens a PR
      # per release — churn that also *reduces* what we track, since a pin stops following v4.
      # A major bump (v4 -> v5) is a real change and still comes through.
      - dependency-name: "github/codeql-action"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
